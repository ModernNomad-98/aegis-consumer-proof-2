# First workflow added to this repository (manual connectivity gate only).
# Purpose: prove that the main-only `proof2-deploy` environment can reach BOTH
# databases with a plain "SELECT 1". Prints PASS/FAIL only, never connection
# values, and fails closed on any error. No provider API call, no deploy, no
# application code. Must be merged to main before it can read these secrets,
# because the environment branch policy allows main only.
name: Connectivity gate (SELECT 1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-1:
    name: SELECT 1 (runtime + migration)
    runs-on: ubuntu-latest
    environment: proof2-deploy
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - name: Probe both database connections (PASS/FAIL only)
        shell: bash
        run: |
          set -u -o pipefail

          if ! command -v psql >/dev/null 2>&1; then
            echo "CONNECTIVITY: FAIL (psql client unavailable)"
            exit 1
          fi

          probe() {
            local name="$1" url="$2" out rc
            if [ -z "$url" ]; then
              printf '%s: FAIL (secret not supplied)\n' "$name"
              return 1
            fi
            # The URL is passed as an argument only; it is never echoed and
            # psql diagnostics are discarded so no host, user or password leaks.
            out="$(psql "$url" -X --no-password -v ON_ERROR_STOP=1 -tA -c 'SELECT 1' 2>/dev/null)"
            rc=$?
            if [ "$rc" -ne 0 ] || [ "$out" != "1" ]; then
              printf '%s: FAIL\n' "$name"
              return 1
            fi
            printf '%s: PASS\n' "$name"
          }

          status=0
          probe DATABASE_URL "${DATABASE_URL:-}" || status=1
          probe MIGRATION_DATABASE_URL "${MIGRATION_DATABASE_URL:-}" || status=1

          if [ "$status" -ne 0 ]; then
            echo "CONNECTIVITY: FAIL"
            exit 1
          fi
          echo "CONNECTIVITY: PASS"
