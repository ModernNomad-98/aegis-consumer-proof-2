# First workflow added to this repository (manual connectivity gate only).
# Purpose: prove that the main-only `proof2-deploy` environment can reach BOTH
# databases with a plain "SELECT 1". Prints PASS/FAIL plus, on failure, exactly
# one fixed class token; never prints connection values, and fails closed on any
# error. No provider API call, no deploy, no application code. Must be merged to
# main before it can read these secrets, because the environment branch policy
# allows main only.
#
# Failure classification: the probe captures psql stderr (it used to discard it)
# and maps the first error class to one token from a fixed vocabulary. stderr is
# first sanitized defensively (anything from `password=` onward and any URL-like
# token is redacted) and is then only pattern-matched: it is never printed and
# never evaluated. The token vocabulary is PASSWORD_AUTH_FAILED, INVALID_URI,
# CONNECT_ERROR, SSL_ERROR, ROLE_NOT_FOUND, DB_NOT_FOUND, SQLSTATE_<code> (only
# for a five-character code matching the fixed pattern) and OTHER. The psql
# invocation, one-attempt-per-URL behaviour, PASS/FAIL labels, secret wiring and
# fail-closed exit semantics are unchanged.
#
# Runner provisioning: the PostgreSQL client (psql) is installed explicitly
# instead of relying on what the ubuntu-latest image happens to ship. The
# preflight then runs the client once, so a missing or broken client is
# classified as a provisioning failure and never reported as a probe result.
name: Connectivity gate (SELECT 1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-1:
    name: SELECT 1 (runtime + migration)
    runs-on: ubuntu-latest
    environment: proof2-deploy
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - name: Provision PostgreSQL client (psql)
        shell: bash
        run: |
          set -u -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Preflight psql client (classified, fail closed)
        shell: bash
        run: |
          set -u -o pipefail

          # A usable client must both resolve on PATH and execute. Either
          # failure is a provisioning failure, not a probe result, so it is
          # reported with the same classification token used by the probe.
          if ! command -v psql >/dev/null 2>&1; then
            echo "CONNECTIVITY: FAIL (psql client unavailable)"
            exit 1
          fi
          if ! psql --version >/dev/null 2>&1; then
            echo "CONNECTIVITY: FAIL (psql client unavailable)"
            exit 1
          fi

      - name: Probe both database connections (PASS/FAIL + fixed failure class)
        shell: bash
        run: |
          set -u -o pipefail

          if ! command -v psql >/dev/null 2>&1; then
            echo "CONNECTIVITY: FAIL (psql client unavailable)"
            exit 1
          fi

          # Defence in depth. The sanitized form is only ever pattern-matched;
          # it is never printed and never evaluated. It removes anything from
          # `password=` to the end of that line and redacts URL-like tokens, so
          # even an unexpected pattern match cannot carry a credential-shaped
          # fragment into the classification step.
          sanitize() {
            local s="$1"
            printf '%s' "$s" | sed -E \
              -e 's/(password=).*/\1<redacted>/I' \
              -e 's#[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+#<redacted>#g'
          }

          # Map sanitized stderr to exactly one token from the fixed vocabulary
          # in this file's header comment. Lower-casing is safe here because the
          # original text is never printed; SQLSTATE is kept only when it is
          # exactly the fixed five-character code. Never returns raw text.
          classify() {
            local err_lc="${1,,}" state=""
            if [[ "$1" =~ (FATAL|ERROR|PANIC):[[:space:]]+([0-9A-Z]{5}): ]]; then
              state="${BASH_REMATCH[2]}"
            elif [[ "$1" =~ SQLSTATE[[:space:]]+([0-9A-Z]{5}) ]]; then
              state="${BASH_REMATCH[1]}"
            fi
            case "$err_lc" in
              *'password authentication failed'*|*'no password supplied'*|*'authentication failed'*)
                printf 'PASSWORD_AUTH_FAILED'
                ;;
              *'role'*'does not exist'*)
                printf 'ROLE_NOT_FOUND'
                ;;
              *'database'*'does not exist'*)
                printf 'DB_NOT_FOUND'
                ;;
              *'invalid uri'*|*'invalid connection string'*|*'could not parse connection string'*|\
              *'invalid percent-encoded'*|*'invalid uri query parameter'*|*'invalid uri scheme'*|\
              *'invalid ipv6 address'*|*'invalid port number'*|*'missing key/value separator'*|\
              *'unrecognized connection parameter'*|*'invalid connection option'*|\
              *'missing "="'*|*'connection string requires a value'*|*'invalid integer value'*|\
              *'invalid sslmode value'*|*'invalid channel_binding value'*|\
              *'invalid gssencmode value'*|*'invalid target_session_attrs value'*)
                printf 'INVALID_URI'
                ;;
              *'ssl error'*|*'ssl syscall'*|*'certificate'*|*'self-signed'*|*'sslmode'*|\
              *'ssl support'*|*'channel binding'*|*'does not support ssl'*|*'ssl connection'*)
                printf 'SSL_ERROR'
                ;;
              *'could not connect'*|*'connection refused'*|*'timeout expired'*|\
              *'connection timed out'*|*'operation timed out'*|*'could not translate host'*|\
              *'name or service not known'*|*'temporary failure in name resolution'*|\
              *'nodename nor servname'*|*'no route to host'*|*'network is unreachable'*|\
              *'connection reset'*|*'server closed the connection unexpectedly'*|\
              *'could not resolve'*|*'connection to server'*)
                printf 'CONNECT_ERROR'
                ;;
              *)
                if [ -n "$state" ]; then
                  printf 'SQLSTATE_%s' "$state"
                else
                  printf 'OTHER'
                fi
                ;;
            esac
          }

          probe() {
            local name="$1" url="$2" out rc err errfile class
            if [ -z "$url" ]; then
              printf '%s: FAIL (secret not supplied)\n' "$name"
              return 1
            fi
            # The URL is passed as an argument only; it is never echoed. stdout
            # and stderr are captured separately, and stderr goes no further
            # than the fixed class token produced below. Exactly one attempt:
            # there is no retry on a failed probe.
            errfile="$(mktemp "${RUNNER_TEMP:-/tmp}/psql-stderr.XXXXXX")" || {
              printf '%s: FAIL (class: OTHER)\n' "$name"
              return 1
            }
            if out="$(psql "$url" -X --no-password -v ON_ERROR_STOP=1 -tA -c 'SELECT 1' 2>"$errfile")"; then
              rc=0
            else
              rc=$?
            fi
            # Captured for classification only; never printed.
            err="$(cat "$errfile" 2>/dev/null || true)"
            rm -f "$errfile"
            if [ "$rc" -ne 0 ] || [ "$out" != "1" ]; then
              class="$(classify "$(sanitize "$err")")"
              printf '%s: FAIL (class: %s)\n' "$name" "$class"
              return 1
            fi
            printf '%s: PASS\n' "$name"
          }

          status=0
          probe DATABASE_URL "${DATABASE_URL:-}" || status=1
          probe MIGRATION_DATABASE_URL "${MIGRATION_DATABASE_URL:-}" || status=1

          if [ "$status" -ne 0 ]; then
            echo "CONNECTIVITY: FAIL"
            exit 1
          fi
          echo "CONNECTIVITY: PASS"
