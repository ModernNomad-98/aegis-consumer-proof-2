name: Deploy reviewed revision
on:
  workflow_dispatch:
    inputs:
      review_pr:
        description: Merged pull request whose reviewed head and tree are deployed
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
concurrency:
  group: deploy-synthetic-service
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The strict deploy gate proves tree(merge)==tree(reviewed head) and
          # reads the merge commit's parents, so full history is required.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ inputs.review_pr }}
  deploy:
    needs: review
    # Existing protected environment for this repository: proof2-deploy
    # (id 25749368568, branch policy id 64859958, policy "main" only).
    environment: proof2-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Apply and verify migration, then test synthetic auth and RLS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          # Non-secret synthetic fixture constant, deliberately NOT an environment
          # secret: this workflow only writes disposable synthetic fixtures to a
          # disposable synthetic database, and the repository has no such secret.
          SYNTHETIC_PASSWORD: synthetic-deploy-fixture-password-only
        run: |
          npm run migrate
          npm run verify:migration
          npm run seed
          npm run test:integration
      - name: Recheck review immediately before deployment
        run: node scripts/review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ inputs.review_pr }}
      - name: Deploy exact revision and verify health
        run: npm run deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          # Owner disposition O2 (2026-10-30 21:02/21:08 PDT): the confirmed
          # Render target is proof2-web and its health path is /health. This is a
          # PLAIN workflow env var - not a secret, not a repository or
          # environment variable (the repository defines none).
          HEALTHCHECK_URL: https://proof2-web.onrender.com/health
